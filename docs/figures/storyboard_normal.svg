<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="790" viewBox="0 0 2200 790"><rect width="100%" height="100%" fill="white"/><text x="55" y="79" font-family="Segoe UI,Arial" font-size="44" font-weight="700" fill="#163338">Normal interaction</text><text x="55" y="130" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Developed walkthrough · fictional fixtures · person actions and system responses</text><rect x="55" y="190" width="470" height="510" rx="12" fill="#f9fbf9" stroke="#c8d4d0" stroke-width="3"/><text x="77" y="240" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#163338">1  Request</text><text x="77" y="297" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">PERSON</text><text x="77" y="337" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Choose public-summary task</text><text x="77" y="427" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">SYSTEM</text><text x="77" y="467" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Prepare a fixture draft</text><text x="77" y="557" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">NEXT</text><text x="77" y="597" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Inspect exact destination</text><path d="M 533 440 L 585 440" stroke="#163338" fill="none" stroke-width="4"/><polygon points="585,440 569.6923992600045,447.3944140798909 569.6923992600045,432.6055859201091" fill="#163338"/><rect x="595" y="190" width="470" height="510" rx="12" fill="#f9fbf9" stroke="#c8d4d0" stroke-width="3"/><text x="617" y="240" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#163338">2  Inspect</text><text x="617" y="297" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">PERSON</text><text x="617" y="337" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Read contact, text and message</text><text x="617" y="427" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">SYSTEM</text><text x="617" y="467" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Show no fixture concern</text><text x="617" y="557" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">NEXT</text><text x="617" y="597" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Explicit review required</text><path d="M 1073 440 L 1125 440" stroke="#163338" fill="none" stroke-width="4"/><polygon points="1125,440 1109.6923992600045,447.3944140798909 1109.6923992600045,432.6055859201091" fill="#163338"/><rect x="1135" y="190" width="470" height="510" rx="12" fill="#f9fbf9" stroke="#c8d4d0" stroke-width="3"/><text x="1157" y="240" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#163338">3  Decide</text><text x="1157" y="297" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">PERSON</text><text x="1157" y="337" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Check review box and approve</text><text x="1157" y="427" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">SYSTEM</text><text x="1157" y="467" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Bind approval to this draft</text><text x="1157" y="557" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">NEXT</text><text x="1157" y="597" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Run mock tool</text><path d="M 1613 440 L 1665 440" stroke="#163338" fill="none" stroke-width="4"/><polygon points="1665,440 1649.6923992600045,447.3944140798909 1649.6923992600045,432.6055859201091" fill="#163338"/><rect x="1675" y="190" width="470" height="510" rx="12" fill="#f9fbf9" stroke="#c8d4d0" stroke-width="3"/><text x="1697" y="240" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#163338">4  Feedback</text><text x="1697" y="297" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">PERSON</text><text x="1697" y="337" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Read the recorded outcome</text><text x="1697" y="427" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">SYSTEM</text><text x="1697" y="467" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">Simulated send recorded</text><text x="1697" y="557" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#176a60">NEXT</text><text x="1697" y="597" font-family="Segoe UI,Arial" font-size="25" font-weight="400" fill="#163338">No real email sent</text></svg>